<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Freedom Control Room</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; max-width: 600px; margin: 0 auto; padding-bottom: 50px; }
        h1 { text-align: center; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; font-size: 22px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .matrix-box { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .matrix-title { font-weight: bold; color: #38bdf8; font-size: 14px; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .card-container { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; border-left: 5px solid #ef4444; position: relative; cursor: pointer; transition: all 0.2s ease; }
        .card-container:hover { background: #24344d; border-color: #475569; }
        .card-container.wiped { border-left-color: #10b981; background: #151f32; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .card-title { font-weight: bold; color: #f1f5f9; font-size: 16px; }
        .card-date { font-size: 11px; color: #38bdf8; font-weight: bold; background: rgba(56, 189, 248, 0.1); padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .card-meta { font-size: 13px; color: #94a3b8; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .bar-wrapper { background: #020617; border-radius: 10px; height: 14px; overflow: hidden; border: 1px solid #475569; position: relative; margin-bottom: 8px; }
        .bar-fill { background: linear-gradient(90deg, #ef4444, #f43f5e); height: 100%; width: 100%; transition: all 0.4s ease; }
        .card-container.wiped .bar-fill { background: #10b981; width: 0% !important; }
        .bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #1e293b; border: 1px solid #475569; border-radius: 16px; width: 100%; max-width: 480px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .modal-title { font-weight: bold; color: #38bdf8; font-size: 18px; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
        input[type="number"], input[type="date"] { width: 100%; padding: 10px; background: #020617; border: 1px solid #475569; border-radius: 8px; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 12px; background: linear-gradient(90deg, #0284c7, #38bdf8); border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        .history-section { margin-top: 20px; border-top: 1px solid #334155; padding-top: 15px; max-height: 120px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid rgba(51, 65, 85, 0.5); }
    </style>
</head>
<body>

    <h1>Financial Freedom Control Room</h1>
    <div class="subtitle">Automated Multi-Bar Debt Payoff Matrix</div>
    
    <div class="matrix-box">
        <div class="matrix-title">
            <span>TOTAL DEBT CLEARED</span>
            <span id="global-pct">0% CLEAR</span>
        </div>
        <div style="background:#020617; border-radius:10px; height:18px; overflow:hidden; border:1px solid #475569;">
            <div id="global-fill" style="background:linear-gradient(90deg, #0284c7, #38bdf8); height:100%; width:0%; transition:width 0.4s;"></div>
        </div>
    </div>

    <div id="cards-container"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="m-title">Account Details</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Set Monthly Due Date (Day of Month)</label>
                <input type="number" id="pay-due-day" min="1" max="31" placeholder="e.g. 15">
            </div>
            <div class="form-group">
                <label>Log Manual Payment ($)</label>
                <input type="number" id="pay-amount" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Payment Date</label>
                <input type="date" id="pay-date">
            </div>
            <button class="submit-btn" onclick="submitForm()">Update Account</button>
            <div class="history-section">
                <label>Payment History</label>
                <div id="history-list"></div>
            </div>
        </div>
    </div>

    <script>
        const initialDebts = [
            { id: "c1", name: "1. Mission Lane Black", start: 1410, bal: 1410, apr: "33.99%", date: "Wiped Jan 2027", pay: 1182.33, dueDay: 5, history: [] },
            { id: "c2", name: "2. Mission Lane Regular", start: 2520, bal: 2520, apr: "28.74%", date: "Wiped Mar 2027", pay: 87.00, dueDay: 12, history: [] },
            { id: "c3", name: "3. Ollo Card", start: 1460, bal: 1460, apr: "27.24%", date: "Wiped May 2027", pay: 34.00, dueDay: 15, history: [] },
            { id: "c4", name: "4. Happen Bank Loan", start: 1720, bal: 1720, apr: "25.49%", date: "Wiped Jul 2027", pay: 252.00, dueDay: 18, history: [] },
            { id: "c5", name: "5. OneMain Financial", start: 7626, bal: 7626, apr: "24.49%", date: "Wiped Nov 2027", pay: 246.00, dueDay: 22, history: [] },
            { id: "c6", name: "6. Affirm Financing", start: 777, bal: 777, apr: "Fixed Fee", date: "Wiped Dec 2027", pay: 260.00, dueDay: 1, history: [] },
            { id: "c7", name: "7. PayPal Credit", start: 1580, bal: 1580, apr: "Closed", date: "Wiped Feb 2028", pay: 30.00, dueDay: 25, history: [] },
            { id: "c8", name: "8. Capital One", start: 3138, bal: 3138, apr: "0% Promo", date: "Freedom May 2028", pay: 32.00, dueDay: 28, history: [] }
        ];

        let debts = JSON.parse(localStorage.getItem('user_debts_v2')) || initialDebts;
        let activeId = null;

        function checkAutoPayments() {
            const today = new Date();
            const currentDay = today.getDate();
            let updated = false;

            debts.forEach(d => {
                if (d.bal > 0 && d.dueDay === currentDay) {
                    const lastHistory = d.history;
                    const currentMonthYear = today.getMonth() + "-" + today.getFullYear();
                    
                    if (!lastHistory || lastHistory.monthYear !== currentMonthYear) {
                        const actualPay = Math.min(d.pay, d.bal);
                        d.bal = Math.max(0, d.bal - actualPay);
                        d.history.unshift({
                            date: today.toISOString().split('T')[0],
                            amt: actualPay,
                            monthYear: currentMonthYear,
                            type: "Auto"
                        });
                        updated = true;
                    }
                }
            });

            if (updated) {
                if (debts[0].bal <= 0 && debts[1].pay === 87) {
                    debts[1].pay = 1269.33;
                }
                renderCards();
            }
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            let totalStart = 0, totalCurrent = 0;

            debts.forEach(d => {
                totalStart += d.start;
                totalCurrent += d.bal;
                const pct = Math.round((d.bal / d.start) * 100);
                const isWiped = d.bal <= 0;

                const card = document.createElement('div');
                card.className = `card-container ${isWiped ? 'wiped' : ''}`;
                card.onclick = () => openModal(d.id);
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">${d.name}</div>
                        <div class="card-date">${d.date}</div>
                    </div>
                    <div class="card-meta">
                        <span>APR: ${d.apr} | Auto-Pay: $${d.pay.toFixed(2)}/mo</span>
                        <span style="color:#38bdf8;">Due: Day ${d.dueDay}</span>
                    </div>
                    <div class="bar-wrapper"><div class="bar-fill" style="width: ${isWiped ? 0 : pct}%;"></div></div>
                    <div class="bar-labels"><span>Current: $${Math.round(d.bal)}</span><span>Target: $0</span></div>
                `;
                container.appendChild(card);
            });

            const globalClear = totalStart - totalCurrent;
            const globalPct = totalStart > 0 ? Math.round((globalClear / totalStart) * 100) : 100;

document.getElementById('global-fill').style.width = globalPct + '%';
document.getElementById('global-pct').innerText = globalPct + '% CLEAR';
localStorage.setItem('user_debts_v2', JSON.stringify(debts));
}
function openModal(id) {
activeId = id;
const d = debts.find(x => x.id === id);
document.getElementById('m-title').innerText = d.name;
document.getElementById('pay-amount').value = '';
document.getElementById('pay-due-day').value = d.dueDay;
document.getElementById('pay-date').value = new Date().toISOString().split('T')[0];
const hList = document.getElementById('history-list');
hList.innerHTML = d.history.length === 0 ? 'No payments recorded yet.' : '';
d.history.forEach(h => {
hList.innerHTML += <div class="history-item"><span>${h.date} (${h.type || 'Manual'})</span><span style="color:#10b981;">-$${h.amt}</span></div>;
});
document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function submitForm() {
const amt = parseFloat(document.getElementById('pay-amount').value);
const date = document.getElementById('pay-date').value;
const newDueDay = parseInt(document.getElementById('pay-due-day').value);
const d = debts.find(x => x.id === activeId);
if (newDueDay >= 1 && newDueDay <= 31) {
d.dueDay = newDueDay;
}
if (amt && amt > 0 && date) {
d.bal = Math.max(0, d.bal - amt);
const today = new Date(date);
d.history.unshift({
date,
amt,
monthYear: today.getMonth() + "-" + today.getFullYear(),
type: "Manual"
});
}
renderCards();
closeModal();
}
checkAutoPayments();
renderCards();
setInterval(checkAutoPayments, 3600000);
